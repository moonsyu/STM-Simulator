[package]
name = "stm-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Feature code of STM-Simulator written in Rust, built to WebAssembly and called from the app's JavaScript"
license = "UNLICENSED"
publish = false

[lib]
# cdylib: the .wasm the app loads. rlib: `cargo test` on the host.
crate-type = ["cdylib", "rlib"]

[dependencies]
# preserve_order: objects keep the order their keys were added in, as JavaScript objects do (project files and
# generated code follow that order).
serde_json = { version = "1", features = ["preserve_order"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
