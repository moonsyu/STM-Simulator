<!doctype html><html lang="ko"><meta charset="utf-8"><title>STM Simulator · 캔버스 UX 시안</title><style>
*{box-sizing:border-box}body{margin:0;background:#13191f;color:#e4edf5;font:13px 'Segoe UI','Malgun Gothic',sans-serif}body.light{background:#fcfdfc;color:#1a2b25;--panel:#f3f7f5;--chrome:#e7efec;--line:#c5d4cc;--accent:#126b4c}body{--panel:#1b232d;--chrome:#222c38;--line:#4b5b6c;--accent:#9bcaff}header,nav{background:var(--chrome);border-bottom:1px solid var(--line);padding:10px 12px}main{display:grid;grid-template-columns:320px 1fr;gap:6px;height:calc(100vh - 77px)}aside{background:var(--panel);padding:16px;overflow:auto}h2{margin:4px 0 20px}p{line-height:1.7}.measure{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}b{font-variant-numeric:tabular-nums}.badge{display:inline-block;border:1px solid var(--accent);padding:2px 6px;margin-left:8px;font-size:11px;font-weight:700}.colors{display:grid;grid-template-columns:repeat(10,22px);gap:6px;margin:16px 0}.colors button{width:22px;height:22px;border:2px solid var(--line);border-radius:50%}.colors button:first-child{outline:2px solid var(--accent);outline-offset:2px}button{color:inherit;background:var(--chrome);border:1px solid var(--line);padding:6px 10px}svg{width:100%;height:100%}.note{border-top:1px solid var(--line);margin-top:24px;padding-top:12px}.empty{display:none}body.empty .wire{display:none}body.empty .empty{display:block}body.running .colors button{cursor:not-allowed}
</style><header><strong>STM Simulator</strong>　캔버스 UX · 0.24.0 시안</header><nav>코드　 <strong>속성 / 측정</strong>　 설정　 장치 Docs</nav><main><aside><section class="wire"><h2>점퍼선</h2><p>시작　PA5<br>끝　LED1 · A</p><div class="measure">전압 · GND 기준 <span><b>3.300 V</b><span class="badge">HIGH</span></span></div><div class="measure">연결된 핀 / 구멍 <b>3</b></div><p>배선 색상</p><div class="colors"></div><button>배선 경로 자동 정렬</button><p class="note">실행 중 측정값만 갱신합니다.<br>LOW / ANALOG / 부유 상태는 텍스트로 구분합니다.</p></section><section class="empty"><h2>회로 살펴보기</h2><p>핀, 배선 또는 부품을 선택하세요.<br>실행 중 전압과 전류를 확인할 수 있습니다.</p></section></aside><svg viewBox="0 0 800 600" aria-label="영역 선택 시안"><path d="M150 300H350V250H520" fill="none" stroke="#23a68a" stroke-width="5"/><rect x="305" y="230" width="90" height="40" fill="#c3a26a"/><text x="325" y="220" fill="currentColor">R1</text><circle cx="520" cy="250" r="20" fill="#e55a4e"/><text x="505" y="210" fill="currentColor">LED1</text><rect x="270" y="170" width="330" height="200" fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="6 4"/><text x="270" y="405" fill="currentColor">Shift + 드래그: 영역 선택 · Ctrl+D: 복제</text></svg></main><script>const p=new URLSearchParams(location.search);document.body.className=[p.get('theme')==='light'?'light':'',p.get('state')||''].join(' ');['#23a68a','#ed6d54','#526272','#646fce','#2799cc','#eab62d','#e98932','#bd6396','#915e39','#e9f2f5','#f4aaa8','#f3c197','#f4e3a2','#bddf9c','#a4d9c7','#a8cde7','#b0baea','#ccb5e4','#dfbdd8','#d4c3b1'].forEach((c,i)=>{const b=document.createElement('button');b.style.background=c;b.title='배선 색상 '+(i+1);b.disabled=p.get('state')==='running';document.querySelector('.colors').append(b)});</script></html>
