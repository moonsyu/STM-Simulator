name: ARM GCC, STM32Cube drivers and Renesas FSP
description: Installs xPack ARM GCC 14.2.1, the STM32CubeF4 / STM32CubeF1 HAL and CMSIS drivers and Renesas FSP v6.6.0 (FPB-RA6E1) under .cache/toolchain (ARM_GCC, STM32CUBE_F4_ROOT, STM32CUBE_F1_ROOT and FSP_ROOT point there).
runs:
  using: composite
  steps:
    # The pinned toolchain is kept in the Actions cache: every job used to download ARM GCC from GitHub Releases and clone
    # the drivers again, which also failed whole runs while github.com answered 504 (2026-11-09). The key follows this
    # file and the pinned manifests, so a version change installs afresh.
    - name: Restore the toolchain cache
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .cache/toolchain
        key: arm-toolchain-${{ runner.os }}-${{ hashFiles('.github/actions/arm-toolchain/action.yml', 'desktop/tool-manifest-f1.json', 'desktop/tool-manifest-fsp.json') }}
    - name: Install ARM GCC and STM32CubeF4 / STM32CubeF1 drivers
      if: steps.cache.outputs.cache-hit != 'true'
      shell: pwsh
      run: |
        # Downloads and clones retry a temporary failure (HTTP 502/503/504, a dropped connection) up to 4 times.
        function Retry([scriptblock]$Action) {
          for ($try = 1; ; $try++) {
            try { & $Action; if ($LASTEXITCODE -and $LASTEXITCODE -ne 0) { throw "exit code $LASTEXITCODE" }; return }
            catch { if ($try -ge 4) { throw }; Write-Output "Retry $try in $(15 * $try) s: $($_.Exception.Message)"; Start-Sleep -Seconds (15 * $try) }
          }
        }
        $dir = '.cache/toolchain'; New-Item -ItemType Directory -Force $dir | Out-Null
        Retry { Invoke-WebRequest 'https://github.com/xpack-dev-tools/arm-none-eabi-gcc-xpack/releases/download/v14.2.1-1.1/xpack-arm-none-eabi-gcc-14.2.1-1.1-win32-x64.zip' -OutFile "$dir/gcc.zip" }
        Expand-Archive "$dir/gcc.zip" -DestinationPath $dir; Remove-Item "$dir/gcc.zip"
        Retry { Remove-Item -Recurse -Force "$dir/cubef4/Drivers/STM32F4xx_HAL_Driver" -ErrorAction SilentlyContinue; git clone --depth 1 --branch v1.8.5 https://github.com/STMicroelectronics/stm32f4xx-hal-driver.git "$dir/cubef4/Drivers/STM32F4xx_HAL_Driver" }
        Retry { Remove-Item -Recurse -Force "$dir/cubef4/Drivers/CMSIS/Device/ST/STM32F4xx" -ErrorAction SilentlyContinue; git clone --depth 1 --branch v2.6.9 https://github.com/STMicroelectronics/cmsis-device-f4.git "$dir/cubef4/Drivers/CMSIS/Device/ST/STM32F4xx" }
        Retry { Remove-Item -Recurse -Force "$dir/cmsis5" -ErrorAction SilentlyContinue; git clone --depth 1 --branch 5.9.0 --filter=blob:none --sparse https://github.com/ARM-software/CMSIS_5.git "$dir/cmsis5" }
        Retry { git -C "$dir/cmsis5" sparse-checkout set CMSIS/Core/Include }
        Copy-Item -Recurse "$dir/cmsis5/CMSIS/Core/Include" "$dir/cubef4/Drivers/CMSIS/Include"
        # STM32CubeF1 v1.8.7 drivers at the commits pinned in desktop/tool-manifest-f1.json.
        foreach ($src in @(@('stm32f1xx-hal-driver', 'fee494a92b5ad331f92ad21f76c66a5cb83773ee', 'Drivers/STM32F1xx_HAL_Driver'), @('cmsis-device-f1', 'c8e9a4a4f16b6d2cb2a2083cbe5161025280fb22', 'Drivers/CMSIS/Device/ST/STM32F1xx'))) {
          $to = "$dir/cubef1/$($src[2])"; git init -q $to
          Retry { git -C $to fetch -q --depth 1 "https://github.com/STMicroelectronics/$($src[0]).git" $src[1] }
          git -C $to checkout -q FETCH_HEAD
        }
        Copy-Item -Recurse "$dir/cmsis5/CMSIS/Core/Include" "$dir/cubef1/Drivers/CMSIS/Include"
        # Renesas FSP v6.6.0 through the app's own installer (pinned files of desktop/tool-manifest-fsp.json, SHA-256 checked).
        Retry { node -e "require('./desktop/tool-installer.cjs').installTools(['fsp'],{root:require('path').resolve('.cache/toolchain')}).then(()=>console.log('Renesas FSP installed'),e=>{console.error(e.message);process.exit(1);})" }
    - name: Check ARM GCC
      shell: pwsh
      run: '& $env:ARM_GCC --version'
