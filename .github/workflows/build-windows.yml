name: Build Windows EXE

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks run as parallel jobs; the release job publishes only when every one of them passed.
  checks:
    name: Static checks and unit tests ${{ matrix.shard }}/3
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Reject vulnerable locked dependencies
        if: matrix.shard == 1
        run: npm audit --audit-level=low
      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $releaseVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -cne "v$releaseVersion" -or $releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Release tag must match the stable package version.' }
      - name: Static checks (undefined names, duplicate keys, unreachable code)
        if: matrix.shard == 1
        run: npm run lint
      - name: Unit, interpreter, emulator and firmware tests (a third of the files)
        run: node --test --test-shard=${{ matrix.shard }}/3 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/github-reporter.mjs --test-reporter-destination=stdout "tests/unit/*.test.js" "tests/interp/*.test.js" "tests/emu/*.test.js" "tests/firmware/*.test.js"
      - name: Update helper replacement and rollback
        if: matrix.shard == 1
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/github-reporter.mjs --test-reporter-destination=stdout tests/release/update-helper.test.mjs

  # The toolchain test files run in six jobs: as one job they were the longest of the run (6.4 min of tests at 1.33.0)
  # and set how long a release takes. scripts/toolchain-shard.mjs holds the groups, balanced by measured time.
  firmware:
    name: ST HAL on ARM GCC and the emulator ${{ matrix.shard }}/6
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI_REQUIRE_TOOLCHAIN: '1'
      ARM_GCC: ${{ github.workspace }}\.cache\toolchain\xpack-arm-none-eabi-gcc-14.2.1-1.1\bin\arm-none-eabi-gcc.exe
      STM32CUBE_F4_ROOT: ${{ github.workspace }}\.cache\toolchain\cubef4
      STM32CUBE_F1_ROOT: ${{ github.workspace }}\.cache\toolchain\cubef1
      FSP_ROOT: ${{ github.workspace }}\.cache\toolchain\FSP
      EXAMPLES: blank,ref_led_tht_2,ref_button_4,ref_lcd_parallel_16,ref_max98357a_9,dma_uart_echo,adc_dma_scan,nvic_preemption,usart_sync_matrix,camera_tft,noise_errors
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        # These tests use neither Electron nor the bundled editor, so the install scripts (the editor build, about 10 s) are
        # skipped. (1.46.2 took this back on the suspicion that it slowed the tests; the cause was the uneven groups.)
        run: npm ci --ignore-scripts
      - name: Install ARM GCC, STM32CubeF4 / STM32CubeF1 drivers and Renesas FSP
        uses: ./.github/actions/arm-toolchain
      - name: Build examples with ST HAL and run them on the emulator
        run: node scripts/toolchain-shard.mjs ${{ matrix.shard }}
      - name: Report firmware build failures
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path work/test-results/toolchain-failures.json) { foreach ($f in (Get-Content work/test-results/toolchain-failures.json -Raw | ConvertFrom-Json)) { Write-Output "::error title=Firmware example::$($f -replace "`r?`n",' ')" } }
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-test-diagnostics-firmware-${{ matrix.shard }}
          path: work/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  # Three jobs, each compiling a third of the sketches by build time (ESP32_SHARD): as one job this was the longest of the run at 1.35.0
  # (5.8 min, 3.9 of them compiling), so it set how long a release takes.
  esp32:
    name: ESP32 example sketches on Arduino CLI ${{ matrix.shard }}/3
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      ESP32_SHARD: ${{ matrix.shard }}/3
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      CI_REQUIRE_ESP32: '1'
      ARDUINO_CLI: ${{ github.workspace }}\.cache\arduino\arduino-cli.exe
      # Everything Arduino CLI downloads stays under .cache/arduino, which is cached between runs.
      ARDUINO_DIRECTORIES_DATA: ${{ github.workspace }}\.cache\arduino\data
      ARDUINO_DIRECTORIES_DOWNLOADS: ${{ github.workspace }}\.cache\arduino\staging
      ARDUINO_DIRECTORIES_USER: ${{ github.workspace }}\.cache\arduino\user
      # The compiled esp32 core and libraries (arduino-cli --build-cache-path) are kept with the cache: compiling the core
      # again on every run was most of this job's 3.6 minutes.
      ESP32_BUILD_CACHE: ${{ github.workspace }}\.cache\arduino\build-cache
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        # These tests use neither Electron nor the bundled editor: skip the install scripts (Electron download, editor build).
        run: npm ci --ignore-scripts
      - name: Restore Arduino CLI, the esp32 core and libraries
        id: arduino-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/arduino
          key: arduino-cli-1.5.1-esp32-3.3.12-dht-1.4.6-unified-1.1.15-pubsub-2.8-buildcache1-esp32only2-${{ runner.os }}
      - name: Install Arduino CLI and the esp32 core for the example sketches
        if: steps.arduino-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $dir = '.cache/arduino'; New-Item -ItemType Directory -Force $dir | Out-Null
          Invoke-WebRequest 'https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1_Windows_64bit.zip' -OutFile "$dir/cli.zip"
          if ((Get-FileHash "$dir/cli.zip" -Algorithm SHA256).Hash -ne 'FABE42E0EB04D00E776A66178299FF95A46C623DBC260F997E58FD514853DD40') { throw 'arduino-cli download checksum differs' }
          Expand-Archive "$dir/cli.zip" -DestinationPath $dir
          Remove-Item "$dir/cli.zip"
          $index = 'https://espressif.github.io/arduino-esp32/package_esp32_index.json'
          & $env:ARDUINO_CLI core update-index --additional-urls $index
          & $env:ARDUINO_CLI core install esp32:esp32@3.3.12 --additional-urls $index
          & $env:ARDUINO_CLI lib install 'DHT sensor library@1.4.6' 'Adafruit Unified Sensor@1.1.15' 'PubSubClient@2.8'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Only the esp32 chip is built (esp32:esp32:esp32). The core installs the precompiled libraries of every chip as
          # tools of their own (esp32c3-libs, esp32s3-libs, esp32p4-libs …), and they are most of the 1.7 GB cache, whose
          # download and unpacking took 45 to 75 s of every job. Their folders stay (Arduino CLI sees the tools as
          # installed); what is in them is not cached.
          Get-ChildItem "$env:ARDUINO_DIRECTORIES_DATA/packages/esp32/tools" -Directory | Where-Object { $_.Name -like 'esp32?*-libs' } | ForEach-Object {
            Get-ChildItem $_.FullName -Directory | ForEach-Object { Write-Output "Not cached: the contents of $($_.FullName)"; Get-ChildItem $_.FullName -Force | Remove-Item -Recurse -Force }
          }
          # Downloaded archives are not needed once installed; the cache keeps the installed core only.
          Remove-Item -Recurse -Force $env:ARDUINO_DIRECTORIES_DOWNLOADS -ErrorAction SilentlyContinue
      - name: Show Arduino CLI version
        run: '& $env:ARDUINO_CLI version'
        shell: pwsh
      - name: Build the example ESP32 sketches
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/github-reporter.mjs --test-reporter-destination=stdout --test-concurrency=1 tests/toolchain/esp32-sketches.test.mjs

  e2e:
    name: Electron end-to-end tests ${{ matrix.shard }}/7
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7]
    env:
      CI_REQUIRE_TOOLCHAIN: '1'
      ARM_GCC: ${{ github.workspace }}\.cache\toolchain\xpack-arm-none-eabi-gcc-14.2.1-1.1\bin\arm-none-eabi-gcc.exe
      STM32CUBE_F4_ROOT: ${{ github.workspace }}\.cache\toolchain\cubef4
      STM32CUBE_F1_ROOT: ${{ github.workspace }}\.cache\toolchain\cubef1
      FSP_ROOT: ${{ github.workspace }}\.cache\toolchain\FSP
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Restore the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure Electron runtime is installed
        shell: pwsh
        run: |
          # The Electron zip comes from GitHub releases; retry a temporary 502/503/504 (1.28.1 CI lost a job to one).
          for ($try = 1; $try -le 4; $try++) { node node_modules/electron/install.js; if ($LASTEXITCODE -eq 0) { exit 0 }; Write-Output "Electron download failed; retry $try in $(15 * $try) s."; Start-Sleep -Seconds (15 * $try) }
          exit 1
      - name: Install ARM GCC, STM32CubeF4 / STM32CubeF1 drivers and Renesas FSP
        uses: ./.github/actions/arm-toolchain
      - name: Electron end-to-end tests (a seventh of the files)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/test-results | Out-Null
          # scripts/e2e-shard.mjs deals the files to the jobs by measured time (node --test-shard deals them by position,
          # which put the three heaviest files of 1.46.3 into one job: 153 s against 68 to 99 s).
          node scripts/e2e-shard.mjs ${{ matrix.shard }}/7 2>&1 | Tee-Object -FilePath work/test-results/e2e.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-test-diagnostics-e2e-${{ matrix.shard }}
          path: work/test-results/**
          if-no-files-found: ignore
          retention-days: 14

  package:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Restore the Electron download
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      # electron-builder downloads 7-Zip and NSIS from GitHub on every build; a 504 there failed the 1.28.0 package job.
      - name: Restore the electron-builder tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\AppData\Local\electron-builder\Cache
          key: electron-builder-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure Electron runtime is installed
        shell: pwsh
        run: |
          # The Electron zip comes from GitHub releases; retry a temporary 502/503/504 (1.28.1 CI lost a job to one).
          for ($try = 1; $try -le 4; $try++) { node node_modules/electron/install.js; if ($LASTEXITCODE -eq 0) { exit 0 }; Write-Output "Electron download failed; retry $try in $(15 * $try) s."; Start-Sleep -Seconds (15 * $try) }
          exit 1
      - name: Build portable executable
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          # One retry: the tool downloads above can time out (HTTP 504) while the build itself is fine.
          # npm ci already built the editor (postinstall), so only the package is built here.
          npm run build:package
          if ($LASTEXITCODE -ne 0) { Write-Output 'Build failed; retrying once.'; Remove-Item -Recurse -Force work/build -ErrorAction SilentlyContinue; npm run build:package }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify package and prepare download
        run: npm run build:artifact
      - name: Verify the packaged app, its update helper and the portable EXE
        run: node --test --test-concurrency=1 --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tests/github-reporter.mjs --test-reporter-destination=stdout tests/release/packaged.test.mjs
      - name: Upload Windows download
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: STM-Simulator-Windows-x64
          path: outputs/artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Add download link to build summary
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: pwsh
        run: |
          "## STM Simulator for Windows x64" >> $env:GITHUB_STEP_SUMMARY
          "[Download EXE bundle]($env:DOWNLOAD_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP, then run STM-Simulator.exe. Node.js is not required." >> $env:GITHUB_STEP_SUMMARY
          "The bundle includes SHA256.txt and third-party license notices. Repository access is required." >> $env:GITHUB_STEP_SUMMARY

  release:
    name: Publish verified release and update manifest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: [checks, firmware, esp32, e2e, package]
    runs-on: windows-latest
    timeout-minutes: 10
    concurrency:
      group: windows-release-publication
      cancel-in-progress: false
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check out release verification tools
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          # This job runs after every other one, so its seconds add to the whole run: only scripts/ is needed here.
          sparse-checkout: scripts
      - name: Download this run's verified build
        shell: pwsh
        run: |
          gh run download $env:GITHUB_RUN_ID --name STM-Simulator-Windows-x64 --dir outputs/artifact
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify files and publish complete release
        shell: pwsh
        run: |
          $releaseInfo = Get-Content outputs/artifact/BUILD-INFO.json -Raw | ConvertFrom-Json
          $releaseVersion = $releaseInfo.version
          if ($releaseVersion -notmatch '^\d+\.\d+\.\d+$') { throw 'Only stable package versions can be published.' }
          $releaseTag = "v$releaseVersion"
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -cne $releaseTag) { throw 'Release tag does not match the package.' }
          $releaseExe = 'STM-Simulator.exe'
          $releaseZip = "STM-Simulator-$releaseVersion-Windows-x64.zip"
          $releaseManifest = Get-Content outputs/artifact/update-manifest.json -Raw | ConvertFrom-Json
          if ($releaseManifest.version -cne $releaseVersion -or $releaseManifest.filename -cne $releaseExe -or $releaseInfo.filename -cne $releaseExe -or $releaseInfo.commit -cne $env:GITHUB_SHA -or $releaseInfo.workflow -cne "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID") { throw 'Build metadata does not match this tag and workflow.' }
          $releaseHash = (Get-FileHash -LiteralPath "outputs/artifact/$releaseExe" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($releaseHash -cne $releaseManifest.sha256 -or (Get-Item -LiteralPath "outputs/artifact/$releaseExe").Length -ne $releaseManifest.bytes) { throw 'EXE verification failed.' }
          Compress-Archive -Path outputs/artifact/* -DestinationPath "outputs/$releaseZip"
          $releaseZipHash = (Get-FileHash -LiteralPath "outputs/$releaseZip" -Algorithm SHA256).Hash.ToLowerInvariant()
          @("$releaseHash  $releaseExe", "$releaseZipHash  $releaseZip") | Set-Content outputs/SHA256.txt -Encoding utf8NoBOM
          $existing = gh release view $releaseTag --json isDraft,url 2>$null
          if ($LASTEXITCODE -eq 0) {
            $existingRelease = $existing | ConvertFrom-Json
            if ($existingRelease.isDraft) { throw 'An unpublished draft exists; inspect and resume it without replacing the tag.' }
            ./scripts/verify-release.ps1 -Tag $releaseTag
            "Release $releaseTag already exists: $($existingRelease.url). Published assets are unchanged." >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $tagCommit = gh api "repos/$env:GH_REPO/git/ref/tags/$releaseTag" --jq '.object.sha' 2>$null
          if ($LASTEXITCODE -eq 0 -and $tagCommit -cne $env:GITHUB_SHA) { throw 'Existing tag points to another commit.' }
          gh release create $releaseTag --target $env:GITHUB_SHA --draft --title "STM Simulator $releaseVersion" --generate-notes
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $releaseTag "outputs/artifact/$releaseExe" "outputs/$releaseZip" outputs/SHA256.txt outputs/artifact/BUILD-INFO.json outputs/artifact/update-manifest.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $latestTag = gh release view --json tagName --jq '.tagName' 2>$null
          $makeLatest = $LASTEXITCODE -ne 0 -or $latestTag -notmatch '^v\d+\.\d+\.\d+$' -or [version]$releaseVersion -ge [version]$latestTag.Substring(1)
          gh release edit $releaseTag --draft=false "--latest=$($makeLatest.ToString().ToLowerInvariant())"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/verify-release.ps1 -Tag $releaseTag -ExpectedCommit $env:GITHUB_SHA -RequireLatest:$makeLatest
