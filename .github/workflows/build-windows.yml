name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      test_scope:
        description: Functional test scope
        type: choice
        default: all
        options:
          - all
          - passive-buzzer

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Windows x64 portable
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # An explicit marker limits only this push; subsequent pushes default to all.
      TEST_SCOPE: ${{ inputs.test_scope || (contains(github.event.head_commit.message, '[test:passive-buzzer]') && 'passive-buzzer') || 'all' }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Ensure Electron runtime is installed
        run: node node_modules/electron/install.js
      - name: Test circuit engine and editor models
        shell: pwsh
        run: |
          if ($env:TEST_SCOPE -eq 'passive-buzzer') { npm run test:passive-buzzer }
          else { npm test }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test Electron editing and HAL workflows
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force work/test-results | Out-Null
          if ($env:TEST_SCOPE -eq 'passive-buzzer') {
            npm run test:passive-buzzer:ui 2>&1 | Tee-Object -FilePath work/test-results/ui-tests.log
          } else {
            npm run test:ui 2>&1 | Tee-Object -FilePath work/test-results/ui-tests.log
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload test diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Windows-test-diagnostics
          path: |
            work/test-results/*.log
            work/test-results/*.json
            work/test-results/*.png
          if-no-files-found: ignore
          retention-days: 14
      - name: Build portable executable
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run build
      - name: Verify package and prepare download
        run: npm run build:artifact
      - name: Upload Windows download
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: STM-Simulator-Windows-x64
          path: outputs/artifact/
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
      - name: Add download link to build summary
        env:
          DOWNLOAD_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: pwsh
        run: |
          "## STM Simulator for Windows x64" >> $env:GITHUB_STEP_SUMMARY
          "[Download EXE bundle]($env:DOWNLOAD_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Extract the ZIP, then run STM-Simulator-*-win-x64.exe. Node.js is not required." >> $env:GITHUB_STEP_SUMMARY
          "The bundle includes SHA256.txt and third-party license notices. Repository access is required." >> $env:GITHUB_STEP_SUMMARY
